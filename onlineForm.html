    <h1 class="folmularTitel">Objednávkový formulář</h1>

    <form action="https://formsubmit.co/sestra@cevnimelnik.cz" method="POST" id="myForm">
      
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://cevnimelnik.cz/thanks.html">
      <input type="hidden" name="_subject" value="Objednávka z webu">

      <input type="text" name="jmeno" required placeholder="Jméno">
      <input type="email" name="email" required placeholder="Email">
      <input type="text" name="telefon" required placeholder="Telefon">
      
      <textarea placeholder="Vaše zpráva" class="form-control" name="zprava" rows="10" required></textarea>

      <div class="g-recaptcha" data-sitekey="6LcFHGcsAAAAANEiXTEUMSug5wOjN9HZrVOJjhbo" style="margin: 15px 0;"></div>
      
      <div id="captcha-error" style="color: red; display: none; margin-bottom: 10px;">
        Prosím potvrďte, že nejste robot.
      </div>

      <button class="myButton" type="submit">ODESLAT</button>
    </form>

    <br>
    <div class="souhlas">
       <p>Odesláním formuláře potvrzujete souhlas se zpracováním osobních údajů.</p>
    </div>

    <script>
      document.getElementById("myForm").addEventListener("submit", function(event) {
        var response = grecaptcha.getResponse();
        
        // If the response is empty, the user didn't click the box
        if (response.length === 0) { 
          event.preventDefault(); // Stop the form!
          document.getElementById("captcha-error").style.display = "block"; // Show error
        }
        // If response is not empty, let the form submit normally.
      });
    </script>

  </body>
